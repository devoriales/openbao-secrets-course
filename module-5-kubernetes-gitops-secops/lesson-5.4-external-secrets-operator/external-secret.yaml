# What an application team commits. This file is safe in a public repository:
# it names a path, not a value.
#
#   kubectl apply -f external-secret.yaml
#   kubectl -n apps get externalsecret reporting
#   kubectl -n apps get secret reporting-config -o yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reporting
  namespace: apps
spec:
  # How often ESO re-reads OpenBao and rewrites the Secret.
  #
  # There is no "watch" here and there cannot be: OpenBao does not push. Set
  # this shorter than the lifetime of what you are syncing, and understand that
  # every refresh is another write into etcd. Zero means fetch once and never
  # update, which is a legitimate choice for a value that never changes.
  refreshInterval: 1m

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    # The Kubernetes Secret ESO creates and keeps up to date.
    name: reporting-config

    # Owner is the default: ESO creates the Secret and sets an ownerReference,
    # so deleting this ExternalSecret deletes the Secret with it. Orphan leaves
    # the Secret behind, which sounds safer and mostly means nobody notices when
    # the sync stops.
    creationPolicy: Owner

    # Retain is the default: if the data disappears from OpenBao, the Secret
    # stays as it was. Delete removes it. Retain keeps a workload running on a
    # value the source of truth no longer has, which is either resilience or a
    # stale credential depending on the day.
    deletionPolicy: Retain

  data:
    - secretKey: DB_URL
      remoteRef:
        # Relative to the store's path. The store says secret, this says
        # apps/reporting, and ESO assembles secret/data/apps/reporting.
        key: apps/reporting
        property: db_url
    - secretKey: API_KEY
      remoteRef:
        key: apps/reporting
        property: api_key
