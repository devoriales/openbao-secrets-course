# How ESO reaches OpenBao. One object, cluster scoped, owned by the platform
# team rather than by any application namespace.
#
# NOTE THE PROVIDER NAME, AND WHY IT IS NOT THE OBVIOUS ONE.
#
# ESO 2.8.0 ships a first class `openBao` provider alongside the older `vault`
# one, and reaching for it is the natural move. Check what it can authenticate
# with before you do:
#
#   kubectl explain clustersecretstore.spec.provider.openBao.auth
#     appRole, tokenSecretRef, userPass
#
#   kubectl explain clustersecretstore.spec.provider.vault.auth
#     appRole, cert, gcp, iam, jwt, kubernetes, ldap, tokenSecretRef, userPass
#
# The OpenBao branded provider has no Kubernetes auth in this release. Applying
# a store that uses it fails at admission:
#
#   strict decoding error: unknown field "spec.provider.openBao.auth.kubernetes"
#
# Every alternative it offers means storing a credential in a Kubernetes Secret
# so that ESO can avoid putting credentials in Kubernetes Secrets. So this store
# uses the `vault` provider, which works against OpenBao for the same reason the
# X-Vault-Namespace header and the vault.hashicorp.com annotations do: OpenBao
# kept the Vault API. Re-check this when you upgrade ESO.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200

      # The mount, not the full path. The data/ segment that K/V v2 requires is
      # appended by ESO, so writing "secret/data" here gets you "secret/data/data".
      path: secret
      version: v2

      # The listener serves a certificate from OpenBao's own PKI, so the system
      # roots are no help. caProvider points at a Secret; because this store is
      # cluster scoped, the namespace is required rather than inferred.
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: external-secrets
        key: ca.crt

      auth:
        kubernetes:
          # The mount path of the auth method, without the auth/ prefix.
          mountPath: kubernetes
          role: eso

          # ESO requests a token for this ServiceAccount and presents it to
          # OpenBao. It is ESO's own identity, not the application's, which is
          # the structural difference from lesson 5.3: there, every pod
          # authenticated as itself.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
