# Garage v2.3.0 as the S3 target for OpenBao snapshots.
#
# Garage, not MinIO: minio/minio has been archived since 2026 and takes no
# further security fixes, which disqualifies it from a course about protecting
# secrets. Garage is S3 compatible, MIT licensed, and the image is 25.8 MB,
# which matters on a laptop already running a three node OpenBao cluster.
#
# Upstream lives at git.deuxfleurs.fr/Deuxfleurs/garage. The GitHub repository
# is a mirror and publishes no releases, so the version is pinned from the tag
# and the Docker Hub tag rather than from a GitHub release.
#
# Single node, replication_factor 1. This is a backup target for a lab, not a
# durable store. A real one is somewhere else entirely: another region, another
# provider, another blast radius than the cluster it is backing up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: openbao-backup
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"
    db_engine    = "sqlite"

    # One node, so one copy. Garage refuses to start if the layout cannot
    # satisfy the replication factor.
    replication_factor = 1

    rpc_bind_addr   = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    # Lab value. Garage requires a 32-byte hex shared secret for node to node
    # RPC; with one node nothing ever uses it, but it must be present and valid.
    rpc_secret      = "0e4b0d1f2a3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6"

    [s3_api]
    s3_region     = "garage"
    api_bind_addr = "[::]:3900"
    root_domain   = ".s3.garage.localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: openbao-backup
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: openbao-backup
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          env:
            # The CLI talks to the daemon over RPC and needs the same secret.
            # Without it every `garage` subcommand fails with a bare
            # "Could not connect to node".
            - name: GARAGE_RPC_SECRET
              value: "0e4b0d1f2a3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6"
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: rpc
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
