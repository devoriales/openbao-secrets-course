# SoftHSM configuration for the lab.
#
# We ship our own instead of using the packaged /etc/softhsm/softhsm2.conf,
# which Debian installs as root:softhsm mode 0750 with nothing in the softhsm
# group. OpenBao runs as uid 100, cannot read it, and SoftHSM reports only
# "Could not load the SoftHSM configuration" with no mention of permissions.
#
# tokendir is the single most important line here. It is where the AES key that
# encrypts the root key actually lives, so it is the directory that has to be on
# a persistent volume and in your backups. Lose it and the barrier never opens
# again, recovery keys included.
#
# It deliberately points inside /openbao/data, which is the chart's persistent
# volume. The Debian default is /var/lib/softhsm/tokens, which in Kubernetes is
# container-local scratch: the token would be generated on first boot, work
# perfectly, and vanish on the first reschedule, taking the barrier with it.
directories.tokendir = /openbao/data/softhsm-tokens/
objectstore.backend = file

log.level = INFO

slots.removable = false
slots.mechanisms = ALL

library.reset_on_fork = false
